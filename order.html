<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sipariş Formu</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>

body{
background:white;
font-family:Arial;
padding:40px;
}

.container{
max-width:500px;
margin:auto;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
width:100%;
padding:12px;
background:black;
color:white;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>Sipariş Bilgileri</h2>

<div id="cartBox"></div>

<input id="name" placeholder="Ad Soyad">
<input id="email" placeholder="Eposta">
<input id="phone" placeholder="Telefon">

<input value="Türkiye" disabled>

<input id="city" placeholder="Şehir">
<input id="district" placeholder="İlçe">
<input id="neighborhood" placeholder="Mahalle">
<input id="street" placeholder="Sokak">
<input id="address" placeholder="Adres Detayı">

<button onclick="sendOrder()">Sipariş Oluştur</button>

</div>

<script>

emailjs.init("BSPo8IONfgvc-LLwO");

let cart=JSON.parse(localStorage.getItem("cart")||"[]");

let total=0;
let list="";

cart.forEach(i=>{
list+=i.name+" - "+i.price+" TL\n";
total+=i.price;
});

document.getElementById("cartBox").innerHTML=
"<b>Sepet:</b><br>"+list+"<br><b>Toplam:</b> "+total+" TL";

function sendOrder(){

let orderCode=Math.floor(100000+Math.random()*900000);

localStorage.setItem("orderCode",orderCode);

emailjs.send("service_cbd5aui","template_coscb9k",{

orderCode:orderCode,

name:document.getElementById("name").value,

email:document.getElementById("email").value,

phone:document.getElementById("phone").value,

city:document.getElementById("city").value,

district:document.getElementById("district").value,

neighborhood:document.getElementById("neighborhood").value,

street:document.getElementById("street").value,

addressDetails:document.getElementById("address").value,

cartItems:list,

totalPrice:total

});

window.location.href="finish.html";

}

</script>

</body>
</html>
