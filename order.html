<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sipariş Formu</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body {
    font-family:Segoe UI;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    margin-top:40px;
}
.container {
    display:flex;
    gap:40px;
}
.cart {
    background:white;
    padding:20px;
    border-radius:15px;
    width:300px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
.form {
    background:white;
    padding:25px;
    border-radius:15px;
    width:400px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
input {
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
}
button {
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#00bfff;
    border:none;
    color:white;
    border-radius:10px;
    cursor:pointer;
}
</style>

<script>
(function(){
    emailjs.init("fbjkTwKw5Qs2poDWS"); // Yeni public key
})();
</script>
</head>

<body>
<div class="container">

<div class="cart">
<h3>Sepetiniz</h3>
<div id="cartItems"></div>
<h3 id="total"></h3>
</div>

<div class="form">
<h3>Adres Bilgileri</h3>
<input id="name" placeholder="Ad Soyad" required>
<input id="email" placeholder="E-posta" required>
<input id="phone" placeholder="Telefon" required>
<input value="Türkiye" disabled>
<input id="city" placeholder="Şehir" required>
<input id="district" placeholder="İlçe" required>
<input id="neighborhood" placeholder="Mahalle" required>
<input id="street" placeholder="Sokak" required>
<input id="addressDetails" placeholder="Adres Detayı" required>
<button onclick="createOrder()">Sipariş Oluştur</button>
</div>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let items = "";
let total = 0;

cart.forEach(p => {
    items += p.name + " - " + p.price + " TL\n";
    total += p.price;
});

document.getElementById("cartItems").innerText = items;
document.getElementById("total").innerText = "Toplam: " + total + " TL";

function createOrder() {
    if(cart.length === 0){
        alert("Sepetiniz boş!");
        return;
    }

    let orderCode = Math.floor(100000 + Math.random() * 900000);
    localStorage.setItem("orderCode", orderCode);

    const data = {
        orderCode: orderCode,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        city: document.getElementById("city").value,
        district: document.getElementById("district").value,
        neighborhood: document.getElementById("neighborhood").value,
        street: document.getElementById("street").value,
        addressDetails: document.getElementById("addressDetails").value,
        cartItems: items,
        totalPrice: total
    };

    emailjs.send("service_cbd5aui","template_coscb9k", data, "fbjkTwKw5Qs2poDWS")
    .then(function(){
        localStorage.removeItem("cart"); // Sepeti temizle
        window.location = "finish.html";
    })
    .catch(function(err){
        alert("Mail gönderilirken hata oluştu: " + err.text);
    });
}
</script>

</body>
</html>
