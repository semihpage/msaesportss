<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sipariş</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<script>
(function(){
emailjs.init("BSPo8IONfgvc-LLwO");
})();
</script>
</head>

<body style="font-family:Arial;background:#f4f6f9;padding:40px;">

<h2>Sipariş Özeti</h2>
<div id="summary"></div>

<h2>Bilgiler</h2>

<input type="text" id="name" placeholder="Ad Soyad"><br><br>
<input type="email" id="email" placeholder="Eposta"><br><br>
<input type="text" id="phone" placeholder="Telefon"><br><br>
<input type="text" id="city" placeholder="Şehir"><br><br>

<button onclick="sendOrder()">Sipariş Oluştur</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;
let summaryText = "";

cart.forEach(item=>{
let itemTotal = item.price * item.qty;
total += itemTotal;
summaryText += item.name + " x" + item.qty + " = " + itemTotal + " TL\n";
});

document.getElementById("summary").innerText =
summaryText + "\nToplam: " + total + " TL";

function sendOrder(){

if(cart.length === 0){
alert("Sepet boş!");
return;
}

let orderCode = Math.floor(100000 + Math.random()*900000);

emailjs.send("service_cbd5aui","template_k1wutyl",{
orderCode: orderCode,
name: document.getElementById("name").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
city: document.getElementById("city").value,
cartItems: summaryText,
totalPrice: total
}).then(function(){

localStorage.removeItem("cart");
window.location.href="finish.html?code="+orderCode;

}).catch(function(e){
alert("Mail Hatası: "+JSON.stringify(e));
});
}
</script>

</body>
</html>
