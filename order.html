<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sipariş Formu</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
padding:40px;
}

.container{
background:white;
width:500px;
padding:40px;
border-radius:12px;
box-shadow:0 5px 25px rgba(0,0,0,0.08);
}

h2{
text-align:center;
margin-bottom:30px;
}

input, textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:8px;
font-size:14px;
}

button{
width:100%;
padding:14px;
background:black;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}
</style>

<script>
(function(){
emailjs.init("BSPo8IONfgvc-LLwO");
})();
</script>
</head>

<body>

<div class="container">
<h2>Sipariş Formu</h2>

<form id="orderForm">

<input type="text" id="name" placeholder="Ad Soyad" required>
<input type="email" id="email" placeholder="E-Posta" required>
<input type="text" id="phone" placeholder="Telefon" required>

<input type="text" id="city" placeholder="Şehir" required>
<input type="text" id="district" placeholder="İlçe" required>
<input type="text" id="neighborhood" placeholder="Mahalle" required>
<input type="text" id="street" placeholder="Sokak" required>
<textarea id="addressDetails" placeholder="Adres Detayı" required></textarea>

<textarea id="cartItems" placeholder="Alınan Ürünler (Örn: 1x Forma - 2x Mouse)" required></textarea>
<input type="number" id="totalPrice" placeholder="Toplam Fiyat (TL)" required>

<button type="submit">Siparişi Oluştur</button>

</form>
</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
e.preventDefault();

let orderCode = Math.floor(100000 + Math.random() * 900000);

emailjs.send("service_cbd5aui","template_k1wutyl",{
orderCode: orderCode,
name: document.getElementById("name").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
city: document.getElementById("city").value,
district: document.getElementById("district").value,
neighborhood: document.getElementById("neighborhood").value,
street: document.getElementById("street").value,
addressDetails: document.getElementById("addressDetails").value,
cartItems: document.getElementById("cartItems").value,
totalPrice: document.getElementById("totalPrice").value
}).then(function(){

window.location.href = "finish.html?code=" + orderCode;

});
});
</script>

</body>
</html>
