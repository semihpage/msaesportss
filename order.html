<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sipariş</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.container{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
max-width:600px;
margin:auto;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
}

button{
width:100%;
padding:15px;
background:black;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.summary{
background:#fafafa;
padding:15px;
margin-bottom:20px;
border-radius:6px;
}
</style>

<script>
(function(){
emailjs.init("BSPo8IONfgvc-LLwO");
})();
</script>
</head>

<body>

<div class="container">

<h2>Sipariş Özeti</h2>
<div class="summary" id="cartSummary"></div>

<h2>Bilgileriniz</h2>

<form id="orderForm">

<input type="text" id="name" placeholder="Ad Soyad" required>
<input type="email" id="email" placeholder="E-Posta" required>
<input type="text" id="phone" placeholder="Telefon" required>

<input type="text" id="city" placeholder="Şehir" required>
<input type="text" id="district" placeholder="İlçe" required>
<input type="text" id="neighborhood" placeholder="Mahalle" required>
<input type="text" id="street" placeholder="Sokak" required>
<input type="text" id="addressDetails" placeholder="Adres Detayı" required>

<button type="submit">Siparişi Oluştur</button>

</form>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;
let summaryText = "";

cart.forEach(item=>{
total += item.price;
summaryText += item.name + " - " + item.price + " TL<br>";
});

summaryText += "<br><b>Toplam: " + total + " TL</b>";
document.getElementById("cartSummary").innerHTML = summaryText;

document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();

let orderCode = Math.floor(100000 + Math.random()*900000);

emailjs.send("service_cbd5aui","template_k1wutyl",{
orderCode: orderCode,
name: document.getElementById("name").value,
email: document.getElementById("email").value,
phone: document.getElementById("phone").value,
city: document.getElementById("city").value,
district: document.getElementById("district").value,
neighborhood: document.getElementById("neighborhood").value,
street: document.getElementById("street").value,
addressDetails: document.getElementById("addressDetails").value,
cartItems: summaryText.replace(/<br>/g,"\n"),
totalPrice: total
}).then(function(){

localStorage.removeItem("cart");
window.location.href = "finish.html?code=" + orderCode;

});
});
</script>

</body>
</html>
