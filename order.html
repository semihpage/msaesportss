<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sipariş Formu</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0f0f0f,#1a1a1a);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:#1f1f1f;
padding:40px;
border-radius:20px;
width:400px;
box-shadow:0 0 30px rgba(0,0,0,0.6);
}

h2{
text-align:center;
margin-bottom:25px;
}

input, textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:#2c2c2c;
color:white;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#00c853;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#00e676;
}
</style>

<script>
(function(){
emailjs.init("hGTQrXIX2M4Uyrmch");
})();
</script>
</head>

<body>

<div class="container">
<h2>Sipariş Formu</h2>

<form id="orderForm">
<input type="text" id="name" placeholder="Ad Soyad" required>
<input type="email" id="email" placeholder="E-Posta" required>
<input type="text" id="phone" placeholder="Telefon" required>
<textarea id="addressDetails" placeholder="Adres" required></textarea>
<button type="submit">Siparişi Oluştur</button>
</form>
</div>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
e.preventDefault();

let orderCode = Math.floor(100000 + Math.random() * 900000);

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let addressDetails = document.getElementById("addressDetails").value;

emailjs.send("service_rd6u8hi","template_krk1kxh",{
name:name,
email:email,
phone:phone,
addressDetails:addressDetails,
orderCode:orderCode
}).then(function(){

// finish sayfasına yönlendir
window.location.href = "finish.html?code=" + orderCode;

});
});
</script>

</body>
</html>
