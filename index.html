<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MSA Shop</title>

<style>
body{
font-family:Arial;
background:#f4f6f9;
padding:40px;
}

.product{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

input[type=number]{
width:60px;
padding:5px;
}

button{
padding:8px 15px;
background:black;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.cart-box{
margin-top:40px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.05);
}
</style>
</head>
<body>

<h2>Ürünler</h2>

<div class="product">
<h3>MSA Forma - 500 TL</h3>
Adet: <input type="number" id="qty1" value="1" min="1">
<button onclick="addToCart('MSA Forma',500,'qty1')">Sepete Ekle</button>
</div>

<div class="product">
<h3>MSA Hoodie - 750 TL</h3>
Adet: <input type="number" id="qty2" value="1" min="1">
<button onclick="addToCart('MSA Hoodie',750,'qty2')">Sepete Ekle</button>
</div>

<div class="cart-box">
<h3>Sepet</h3>
<div id="cartList"></div>
<h4 id="totalPrice"></h4>
<br>
<button onclick="goOrder()">Siparişe Git</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name,price,qtyId){
let qty = parseInt(document.getElementById(qtyId).value);

let existing = cart.find(item => item.name === name);

if(existing){
existing.qty += qty;
}else{
cart.push({name:name,price:price,qty:qty});
}

localStorage.setItem("cart",JSON.stringify(cart));
renderCart();
}

function renderCart(){
let list = "";
let total = 0;

cart.forEach((item,index)=>{
let itemTotal = item.price * item.qty;
total += itemTotal;

list += item.name + 
" x" + item.qty + 
" = " + itemTotal + " TL " +
"<button onclick='removeItem("+index+")'>Sil</button><br><br>";
});

document.getElementById("cartList").innerHTML = list;
document.getElementById("totalPrice").innerHTML = "Toplam: " + total + " TL";
}

function removeItem(index){
cart.splice(index,1);
localStorage.setItem("cart",JSON.stringify(cart));
renderCart();
}

function goOrder(){
if(cart.length === 0){
alert("Sepet boş!");
return;
}
window.location.href="order.html";
}

renderCart();
</script>

</body>
</html>
