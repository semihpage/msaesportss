<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sipariş Oluşturuldu</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.box{
background:white;
padding:50px;
border-radius:12px;
box-shadow:0 5px 25px rgba(0,0,0,0.08);
width:500px;
}

.code{
font-size:26px;
margin:20px 0;
color:black;
font-weight:bold;
}

.whatsapp{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#25D366;
color:white;
border-radius:8px;
text-decoration:none;
}
</style>
</head>

<body>

<div class="box">
<h1>SİPARİŞİNİZ OLUŞTURULDU</h1>

<p>Ödeme için sipariş kodunuz:</p>

<div class="code" id="orderCode"></div>

<p>Bu sipariş kodunu aşağıdaki numaraya yazabilirsiniz:</p>

<p><b>+90 539 658 0556</b></p>

<a id="wpLink" class="whatsapp" target="_blank">WhatsApp ile Gönder</a>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let code = params.get("code");

document.getElementById("orderCode").innerText = code;

let message = "Merhaba, sipariş kodum: " + code;
let link = "https://wa.me/905396580556?text=" + encodeURIComponent(message);

document.getElementById("wpLink").href = link;
</script>

</body>
</html>
