<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sipariş Tamamlandı</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    text-align: center;
    padding: 50px;
}
h1 {
    color: #28a745;
}
p {
    font-size: 18px;
}
button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
}
button:hover { background: #0056b3; }
</style>
</head>
<body>

<h1>Siparişiniz Başarıyla Alındı!</h1>
<p id="orderCode">Sipariş Kodunuz: </p>
<button onclick="window.location.href='index.html'">Ana Sayfaya Dön</button>

<script>
const code = localStorage.getItem("orderCode");
if(code) {
    document.getElementById("orderCode").innerText = "Sipariş Kodunuz: " + code;
    localStorage.removeItem("orderCode");
} else {
    document.getElementById("orderCode").innerText = "Sipariş kodu bulunamadı.";
}
</script>

</body>
</html>
