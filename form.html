<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
emailjs.init("hGTQrXIX2M4Uyrmch");
})();
</script>
</head>
<body style="font-family:Arial; background:#111; color:white;">

<h2>Sipariş Formu</h2>

<form id="orderForm">

<input type="text" id="name" placeholder="Ad Soyad" required><br><br>
<input type="email" id="email" placeholder="E-Posta" required><br><br>
<input type="text" id="phone" placeholder="Telefon" required><br><br>
<input type="text" id="city" placeholder="Şehir" required><br><br>
<input type="text" id="district" placeholder="İlçe" required><br><br>
<input type="text" id="neighborhood" placeholder="Mahalle" required><br><br>
<input type="text" id="street" placeholder="Sokak" required><br><br>
<textarea id="addressDetails" placeholder="Adres Detayı" required></textarea><br><br>

<button type="submit">Siparişi Gönder</button>

</form>

<script>
document.getElementById("orderForm").addEventListener("submit", function(e){
e.preventDefault();

let orderCode = Math.floor(100000 + Math.random() * 900000);

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let phone = document.getElementById("phone").value;
let city = document.getElementById("city").value;
let district = document.getElementById("district").value;
let neighborhood = document.getElementById("neighborhood").value;
let street = document.getElementById("street").value;
let addressDetails = document.getElementById("addressDetails").value;

emailjs.send("service_rd6u8hi","template_krk1kxh",{
name: name,
email: email,
phone: phone,
city: city,
district: district,
neighborhood: neighborhood,
street: street,
addressDetails: addressDetails,
orderCode: orderCode
}).then(function(){

alert("Sipariş Gönderildi! Sipariş Kodunuz: " + orderCode);

}, function(error){

alert("Hata oluştu!");

});

});
</script>

</body>
</html>
