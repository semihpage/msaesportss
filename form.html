<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MSA Esports Sipariş Formu</title>
<style>
body { font-family:'Segoe UI', sans-serif; background:#f5f5f5; color:#111; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh;}
.container { display:flex; gap:30px; flex-direction:column; width:400px; }
#formSection { background:#fff; padding:25px; border-radius:20px; width:100%; box-shadow:0 4px 15px rgba(0,0,0,0.2);}
#formSection h2 { text-align:center; margin-bottom:20px;}
input { padding:10px; margin-top:8px; width:100%; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; }
button { width:100%; margin-top:10px; padding:10px; border-radius:10px; background:#00bfff; color:#fff; border:none; cursor:pointer; font-weight:bold; }
button:hover{background:#0099cc;}
</style>
</head>
<body>
<div class="container">
  <div id="formSection">
    <h2>Sipariş Formu</h2>
    <input type="text" id="name" placeholder="Ad Soyad" required>
    <input type="email" id="email" placeholder="Eposta" required>
    <input type="text" id="phone" placeholder="Telefon (5xx xxx xx xx)" required>
    <input type="text" id="city" placeholder="Şehir" required>
    <input type="text" id="district" placeholder="İlçe" required>
    <input type="text" id="neighborhood" placeholder="Mahalle" required>
    <input type="text" id="street" placeholder="Sokak" required>
    <input type="text" id="addressDetails" placeholder="Adres Detayı" required>
    <input type="text" id="discount" placeholder="İndirim Kodu"><br>
    <button id="submitOrder">Ödeme Yap</button>
  </div>
</div>

<script>
// Sepetten bağımsız test için
let cart = JSON.parse(localStorage.getItem("userCart") || "[]");

// Telefon doğrulama
function isValidTurkishPhone(phone){ return /^5\d{9}$/.test(phone.replace(/\D/g,'')); }

document.getElementById("submitOrder").addEventListener("click", ()=>{
  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value.replace(/\D/g,''),
    city: document.getElementById("city").value,
    district: document.getElementById("district").value,
    neighborhood: document.getElementById("neighborhood").value,
    street: document.getElementById("street").value,
    addressDetails: document.getElementById("addressDetails").value,
    discount: document.getElementById("discount").value,
    cart: cart
  };

  // Boş kontrol
  for(let key in data){
    if(key !== "discount" && key !== "cart" && !data[key]){
      alert("Lütfen tüm bilgileri eksiksiz doldurun!");
      return;
    }
  }
  if(!isValidTurkishPhone(data.phone)){
    alert("Lütfen geçerli bir Türk telefon numarası girin (5xx xxx xx xx)!");
    return;
  }

  // IBAN sayfasına veri gönder
  localStorage.setItem("orderData", JSON.stringify(data));
  window.location.href = "iban.html";
});
</script>
</body>
</html>
