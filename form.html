<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MSA Esports Sipariş Formu</title>
<style>
body { font-family:'Segoe UI', sans-serif; background:#f5f5f5; color:#111; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh;}
.container { display:flex; gap:30px; flex-direction:column; width:400px; }
#cartSection { background:#fff; padding:20px; border-radius:20px; width:100%; max-height:300px; overflow-y:auto; box-shadow:0 4px 15px rgba(0,0,0,0.2);}
#cartSection h2 { text-align:center; margin-top:0; }
.cartItem { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px;}
.cartItem img { width:50px; border-radius:8px; margin-right:10px;}
#cartTotal { text-align:right; font-weight:bold; margin-top:10px;}

#formSection { background:#fff; padding:25px; border-radius:20px; width:100%; box-shadow:0 4px 15px rgba(0,0,0,0.2);}
#formSection h2 { text-align:center; margin-bottom:20px;}
input, select { padding:10px; margin-top:8px; width:100%; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; }
button { width:100%; margin-top:10px; padding:10px; border-radius:10px; background:#00bfff; color:#fff; border:none; cursor:pointer; font-weight:bold; }
button:hover{background:#0099cc;}
</style>
</head>
<body>

<div class="container">
  <div id="cartSection">
    <h2>Sepetiniz</h2>
    <div id="cartItems"></div>
    <div id="cartTotal">Toplam: 0 TL</div>
  </div>

  <div id="formSection">
    <h2>Sipariş Formu</h2>
    <input type="text" id="name" placeholder="Ad Soyad" required>
    <input type="email" id="email" placeholder="Eposta" required>
    <input type="text" id="phone" placeholder="Telefon (5xx xxx xx xx)" required>
    <input type="text" id="city" placeholder="Şehir" required>
    <input type="text" id="district" placeholder="İlçe" required>
    <input type="text" id="neighborhood" placeholder="Mahalle" required>
    <input type="text" id="street" placeholder="Sokak" required>
    <input type="text" id="addressDetails" placeholder="Adres Detayı" required>
    <input type="text" id="discount" placeholder="İndirim Kodu">
    <button id="submitOrder">Ödeme Yap</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("YOUR_USER_ID"); // EmailJS kullanıcı ID

let cart = JSON.parse(localStorage.getItem("userCart") || "[]");
const cartItemsDiv = document.getElementById("cartItems");
const cartTotalDiv = document.getElementById("cartTotal");

function calculateTotal(){
  let total = cart.reduce((a,b)=>a+b.price,0);
  const discount = document.getElementById("discount")?.value;
  if(discount) total = Math.round(total*0.97);
  return total;
}

function renderCart(){
  cartItemsDiv.innerHTML="";
  cart.forEach((item,i)=>{
    const div=document.createElement("div");
    div.className="cartItem";
    div.innerHTML = `<img src="${item.img}"><span>${item.name}</span><span>${item.price} TL</span>`;
    cartItemsDiv.appendChild(div);
  });
  cartTotalDiv.textContent = `Toplam: ${calculateTotal()} TL`;
}

renderCart();

function isValidTurkishPhone(phone){ return /^5\d{9}$/.test(phone.replace(/\D/g,'')); }

document.getElementById("submitOrder").addEventListener("click", ()=>{
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const phone = document.getElementById("phone").value.replace(/\D/g,'');
  const city = document.getElementById("city").value;
  const district = document.getElementById("district").value;
  const neighborhood = document.getElementById("neighborhood").value;
  const street = document.getElementById("street").value;
  const addressDetails = document.getElementById("addressDetails").value;
  const discount = document.getElementById("discount").value;

  if(!name||!email||!phone||!city||!district||!neighborhood||!street||!addressDetails){
    alert("Lütfen tüm bilgileri eksiksiz doldurun!"); return;
  }
  if(!isValidTurkishPhone(phone)){ alert("Lütfen geçerli bir Türk telefon numarası girin (5xx xxx xx xx)!"); return; }

  // IBAN sayfası aç
  const ibanPage = window.open("", "_blank", "width=500,height=600");
  ibanPage.document.write(`
  <html>
  <head>
  <title>Ödeme Sayfası</title>
  <style>
  body { font-family:'Segoe UI', sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; background:#f5f5f5; }
  .box { background:#fff; padding:30px; border-radius:15px; width:400px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.2); }
  .iban { font-size:18px; color:#000; margin-bottom:20px; font-weight:bold; }
  button { padding:10px 15px; margin:5px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; font-size:16px;}
  #confirm { background:green; color:#fff; }
  #cancel { background:red; color:#fff; }
  .warning { background:red; color:#fff; padding:10px; margin-top:20px; border-radius:10px; font-weight:bold; }
  </style>
  </head>
  <body>
    <div class="box">
      <div class="iban">TRXX XXXX XXXX XXXX XXXX XXXX XX</div>
      <button id="confirm">Onayla</button>
      <button id="cancel">Siparişi İptal Et</button>
      <div class="warning">UYARI! PARAYI GÖNDERİRKEN İBAN AÇIKLAMASINA "msaesports" YAZMANIZ GEREKMEKTEDİR AKSİ TAKDİRDE PARA GEÇERSİZ SAYILICAK VE SİZE GERİ GÖNDERİLİCEK!</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
      emailjs.init("YOUR_USER_ID");
      document.getElementById("confirm").addEventListener("click", ()=>{
        // Mail gönder
        emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
          name:"${name}", email:"${email}", phone:"${phone}", city:"${city}",
          district:"${district}", neighborhood:"${neighborhood}", street:"${street}",
          address:"${addressDetails}", discount:"${discount}", cart:JSON.stringify(${JSON.stringify(cart)})
        }).then(()=>{ 
          document.body.innerHTML='<h1 style="text-align:center;">İşlem Başarılı!</h1>';
          setTimeout(()=>{ window.location.href="index.html"; }, 3000);
        }, (err)=>{ alert("Mail gönderilemedi: "+err); });
      });
      document.getElementById("cancel").addEventListener("click", ()=>{ window.close(); });
    </script>
  </body>
  </html>
  `);
});
</script>
</body>
</html>
