<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MSA Esports Sipariş Formu</title>
<style>
body { font-family:'Segoe UI', sans-serif; background:#f5f5f5; margin:0; padding:0; display:flex; justify-content:center; align-items:center; height:100vh;}
#formContainer { background:#fff; padding:30px; border-radius:20px; width:400px; box-shadow:0 4px 20px rgba(0,0,0,0.2);}
h2 { text-align:center; margin-bottom:20px;}
input, select { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box;}
button { width:100%; padding:12px; margin-top:15px; border-radius:10px; border:none; background:#00bfff; color:#fff; font-weight:bold; cursor:pointer;}
button:hover { background:#0099cc;}
</style>
</head>
<body>
<div id="formContainer">
<h2>Sipariş Formu</h2>
<input type="text" id="name" placeholder="Ad Soyad" required>
<input type="email" id="email" placeholder="Eposta" required>
<input type="text" id="phone" placeholder="Telefon (5xx xxx xx xx)" required>
<input type="text" id="city" placeholder="Şehir" required>
<input type="text" id="district" placeholder="İlçe" required>
<input type="text" id="neighborhood" placeholder="Mahalle" required>
<input type="text" id="street" placeholder="Sokak" required>
<input type="text" id="addressDetails" placeholder="Adres Detayı" required>
<button id="submitOrder">Siparişi Onayla</button>
</div>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("YOUR_USER_ID"); // <--- Burası EmailJS User ID

function isValidTurkishPhone(phone) {
    return /^5\d{9}$/.test(phone.replace(/\D/g,''));
}

document.getElementById("submitOrder").addEventListener("click", ()=>{
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value.replace(/\D/g,'');
    const city = document.getElementById("city").value;
    const district = document.getElementById("district").value;
    const neighborhood = document.getElementById("neighborhood").value;
    const street = document.getElementById("street").value;
    const addressDetails = document.getElementById("addressDetails").value;

    if(!name||!email||!phone||!city||!district||!neighborhood||!street||!addressDetails){
        alert("Lütfen tüm alanları doldurun!"); return;
    }
    if(!isValidTurkishPhone(phone)){ alert("Geçerli bir Türk telefon numarası girin (5xx xxx xx xx)"); return; }

    // 6 haneli sipariş kodu üret
    const orderCode = Math.floor(100000 + Math.random()*900000);

    // Email gönderme
    emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",{
        name, email, phone, city, district, neighborhood, street, addressDetails,
        orderCode
    }).then(()=>{ 
        // Kod sayfasını aç ve sipariş kodunu gönder
        const params = new URLSearchParams({code: orderCode});
        window.open("kod.html?" + params.toString(), "_blank");
    }).catch((err)=>{ console.error(err); alert("Mail gönderilemedi!"); });
});
</script>
</body>
</html>
